apiVersion: v1
kind: Namespace
metadata: {name: aegisllm}
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-auth
  namespace: aegisllm
type: Opaque
stringData:
  POSTGRES_PASSWORD: change-me-aegis-postgres-password
---
apiVersion: v1
kind: Secret
metadata:
  name: aegisllm-api-secrets
  namespace: aegisllm
type: Opaque
stringData:
  DATABASE_URL: ******postgres:5432/aegis
  AEGIS_API_KEY: change-me-aegis-api-key
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: aegisllm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:17-alpine
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_DB
          value: aegis
        - name: POSTGRES_USER
          value: aegis
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-auth
              key: POSTGRES_PASSWORD
        volumeMounts:
        - name: pgdata
          mountPath: /var/lib/postgresql/data
        readinessProbe:
          exec:
            command: ["sh", "-c", "pg_isready -U aegis -d aegis"]
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          exec:
            command: ["sh", "-c", "pg_isready -U aegis -d aegis"]
          initialDelaySeconds: 10
          periodSeconds: 20
      volumes:
      - name: pgdata
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: aegisllm
spec:
  selector:
    app: postgres
  ports:
  - port: 5432
    targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: aegisllm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:8-alpine
        command: ["redis-server", "--appendonly", "yes"]
        ports:
        - containerPort: 6379
        readinessProbe:
          exec:
            command: ["redis-cli", "ping"]
          initialDelaySeconds: 3
          periodSeconds: 10
        livenessProbe:
          exec:
            command: ["redis-cli", "ping"]
          initialDelaySeconds: 5
          periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: aegisllm
spec:
  selector:
    app: redis
  ports:
  - port: 6379
    targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: aegisllm, namespace: aegisllm}
spec:
  replicas: 2
  selector: {matchLabels: {app: aegisllm}}
  template:
    metadata: {labels: {app: aegisllm}}
    spec:
      initContainers:
      - name: wait-for-postgres
        image: busybox:1.36
        command: ["sh", "-c", "until nc -z postgres 5432; do echo waiting for postgres; sleep 2; done"]
      - name: wait-for-redis
        image: busybox:1.36
        command: ["sh", "-c", "until nc -z redis 6379; do echo waiting for redis; sleep 2; done"]
      containers:
      - name: api
        image: aegisllm-production-platform-api:1.0.0
        imagePullPolicy: IfNotPresent
        ports: [{containerPort: 8080}]
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: aegisllm-api-secrets
              key: DATABASE_URL
        - {name: REDIS_URL, value: redis://redis:6379/0}
        - {name: KAFKA_BOOTSTRAP, value: kafka:9092}
        - {name: MODEL_BACKEND, value: mock}
        - name: AEGIS_API_KEY
          valueFrom:
            secretKeyRef:
              name: aegisllm-api-secrets
              key: AEGIS_API_KEY
        - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: http://jaeger:4317}
        - {name: OTEL_SERVICE_NAME, value: aegisllm-gateway}
        readinessProbe: {httpGet: {path: /health/ready, port: 8080}, initialDelaySeconds: 10, periodSeconds: 10}
        livenessProbe: {httpGet: {path: /health/live, port: 8080}, initialDelaySeconds: 15, periodSeconds: 20}
        resources:
          requests: {cpu: 100m, memory: 256Mi}
          limits: {cpu: '1', memory: 1Gi}
---
apiVersion: v1
kind: Service
metadata: {name: aegisllm, namespace: aegisllm}
spec:
  selector: {app: aegisllm}
  ports: [{port: 80, targetPort: 8080}]