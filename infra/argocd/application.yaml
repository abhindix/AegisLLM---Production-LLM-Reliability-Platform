apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aegisllm
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/REPLACE_ME/aegisllm.git
    targetRevision: main
    path: infra/helm/aegisllm
  destination:
    server: https://kubernetes.default.svc
    namespace: aegisllm
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
