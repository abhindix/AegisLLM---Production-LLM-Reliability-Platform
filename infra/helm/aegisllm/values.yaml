image:
  repository: aegisllm-production-platform-api
  tag: "1.0.0"
  pullPolicy: IfNotPresent

replicaCount: 2

service:
  type: ClusterIP
  port: 80

env:
  MODEL_BACKEND: mock
  REDIS_URL: redis://redis:6379/0
  KAFKA_BOOTSTRAP: kafka:9092

resources:
  requests: {cpu: 100m, memory: 256Mi}
  limits: {cpu: '1', memory: 1Gi}
secrets:
  databaseUrl: ******postgres:5432/aegis
  apiKey: change-me-aegis-api-key
