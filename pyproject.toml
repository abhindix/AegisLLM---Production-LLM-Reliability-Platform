[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"
[project]
name = "aegisllm"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
"fastapi==0.116.1","uvicorn[standard]==0.35.0","pydantic==2.11.7","SQLAlchemy==2.0.43","psycopg[binary]==3.2.9","redis==6.4.0","kafka-python==2.2.15","prometheus-client==0.22.1","requests==2.32.5","langgraph==0.6.6","opentelemetry-api==1.37.0","opentelemetry-sdk==1.37.0","opentelemetry-exporter-otlp==1.37.0","opentelemetry-instrumentation-fastapi==0.58b0"]
[tool.pytest.ini_options]
pythonpath = ["."]
